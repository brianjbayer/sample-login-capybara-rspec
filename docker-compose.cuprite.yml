# WIP: docker compose -f docker-compose.yml  -f docker-compose.cuprite.yml -f docker-compose.dev.yml run --rm --service-ports browsertests
# must find host ip not servicename DNS of cupritebrowser
# docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' sample-login-capybara-rspec-cupritebrowser-1

services:
  browsertests:
    environment:
      - CAPYBARA_DRIVER=cuprite
      - HEADLESS
      # Must Use Static IP not service name DNS
      # of the chrome browser
      - REMOTE_BROWSER=http://172.28.1.1:9222
      - WAIT_ON_ENDPOINT=http://172.28.1.1:9222
    networks:
      - cuprite-chrome-network
    depends_on:
      - cupritebrowser

  cupritebrowser:
    # image: nginx:alpine
    # volumes:
    #   - ./cuprite-chrome.nginx.conf:/etc/nginx/nginx.conf:ro
    # ports:
    #   - "9222:80" # Allows visibility into proxy
    # depends_on:
    #   - chromenode

  # chromenode:
    image: zenika/alpine-chrome:latest
    ports:
    - "${CUPRITE_LOCALHOST_PORT:-9222}:9222"
    networks:
      cuprite-chrome-network:
        ipv4_address: 172.28.1.1
    shm_size: '4gb'
    command: [
      "chromium-browser",
      "--remote-debugging-port=9222",
      "--remote-debugging-address=0.0.0.0",
      "--remote-allow-origins=*",
      "--no-sandbox",
      "--disable-gpu",
      "--disable-dev-shm-usage"
    ]
    # Tell Docker Compose to boot multiple identical containers
    # deploy:
    #   replicas: 2 # Spawns 2 completely independent Chrome containers

# Must define a custom network to set the Chrome static IP
networks:
  cuprite-chrome-network:
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
