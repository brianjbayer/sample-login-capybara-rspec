# WIP: docker compose -f docker-compose.yml  -f docker-compose.cuprite.yml -f docker-compose.dev.yml run --rm --service-ports browsertests
# must find host ip not servicename DNS of cupritebrowser
# docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' sample-login-capybara-rspec-cupritebrowser-1

services:
  browsertests:
    environment:
      - CAPYBARA_DRIVER=cuprite
      - HEADLESS
      # Must Use Static IP not service name DNS
      # of the chrome browser
      - REMOTE_BROWSER=http:seleniumbrowser:9222
      - REMOTE_BROWSER_HOSTNAME=http:seleniumbrowser
      - REMOTE_BROWSER_PORT=9222
      - WAIT_ON_ENDPOINT=http:seleniumbrowser:9222
    depends_on:
      - seleniumbrowser

  seleniumbrowser:
    # The selenium/standalone-chromium image is multiplatform (arm64)
    image: ${SELENIUM_IMAGE:-selenium/standalone-chromium:latest}
    platform: ${SELENIUM_IMAGE_PLATFORM:-}
    container_name: ${SELENIUM_HOSTNAME:-seleniumbrowser}
    shm_size: 4gb
    volumes:
      - /dev/shm:/dev/shm
    ports:
      - "${SELENIUM_LOCALHOST_CDP_PORT:-9222}:9222"
    environment:
      - SE_START_XVFB=false # Optimizes resources if running headless
      - SE_OPTS=--chrome-flags="--remote-debugging-port=9222 --remote-debugging-address=0.0.0.0 --remote-allow-origins=* --no-sandbox"
      # The number of browser sessions should correspond to parallelism
      # - SE_NODE_MAX_SESSIONS=2
    healthcheck:
      test: ["CMD-SHELL", '/opt/bin/check-grid.sh --host 0.0.0.0 --port 4444']
      interval: 15s
      timeout: 30s
      retries: 5
