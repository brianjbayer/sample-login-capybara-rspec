events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Define the pool of Chrome containers
    upstream chrome_pool {
        ip_hash; # CRITICAL: Sticky sessions bind each test worker to one Chrome container

        # 'chrome' matches the service name in docker-compose.yml.
        # Docker's internal DNS automatically resolves this to all scaled instances.
        server chromenode:9222;
    }

    server {
        listen 80;

        location / {
            # Route traffic into the load-balanced pool
            proxy_pass http://chrome_pool;

            # WebSocket support flags
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Satisfy Chromium's host binding verification security
            proxy_set_header Host 127.0.0.1:9222;

            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
